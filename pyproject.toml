[tool.pytest.ini_options]
# Keep real-project integration tests out of ordinary local test runs.
addopts = ["-m", "not staging"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "isolation: multi-user isolation tests, run against fakes (tests/test_isolation.py)",
    "staging: runs against the real staging project; only via scripts/run_staging_tests.py",
]
